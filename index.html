<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Módulo de Evaluación de Operaciones - The Italian Coffee Company</title>
  <meta name="description"
    content="Valida y perfecciona tu conocimiento del Manual de Operaciones de The Italian Coffee Company con nuestro simulador dinámico e interactivo de barismo y estándares de calidad.">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Main Container -->
  <main class="container">

    <!-- 2. Vista A: Hero Section (Intro - Simplified) -->
    <section class="hero-section" id="hero-section"
      style="width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; box-sizing: border-box; padding: 20px;">
      <h1
        style="font-family: 'Playfair Display', 'Georgia', serif; font-size: 3rem; font-weight: 800; color: #3B2F2F; text-transform: uppercase; margin: 0; line-height: 1.2;">
        THE ITALIAN COFFEE</h1>
      <h2
        style="font-family: 'Montserrat', 'Inter', sans-serif; font-size: 1.2rem; font-weight: 600; color: #D4AF37; text-transform: uppercase; letter-spacing: 0.4em; margin-top: 5px; margin-bottom: 30px;">
        COMPANY</h2>
      <button class="cta-button" id="btn-start-quiz"
        style="background-color: #3B2F2F; color: #FFFFFF; border: none; padding: 16px 40px; font-size: 1.1rem; font-weight: 600; font-family: 'Montserrat', 'Inter', sans-serif; border-radius: 30px; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: 0.3s; border: 2px solid #3B2F2F; box-shadow: 0 8px 24px rgba(43, 27, 23, 0.08);">
        Iniciar Test de Operaciones &rarr;
      </button>
    </section>

    <!-- Vista Intermedia B: Registro de Colaborador -->
    <section class="auth-section" id="auth-section"
      style="display: none; width: 100%; flex-direction: column; align-items: center; justify-content: center; text-align: center; box-sizing: border-box; padding: 20px;">
      <div class="widget-card"
        style="padding: 40px 32px; width: 100%; max-width: 420px; box-sizing: border-box; text-align: left; margin: 0;">
        <h2
          style="font-family: 'Playfair Display', Georgia, serif; font-size: 1.8rem; font-weight: 700; color: #3B2F2F; margin-bottom: 24px; text-align: center;">
          Identificación del Colaborador</h2>
        <form id="auth-form" onsubmit="event.preventDefault();">
          <div class="form-group" style="margin-bottom: 20px;">
            <label for="user-name"
              style="display: block; font-family: 'Montserrat', sans-serif; font-size: 0.85rem; font-weight: 600; color: #3B2F2F; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em;">Nombre
              Completo</label>
            <input type="text" id="user-name" required placeholder="Ej. Juan Pérez"
              style="width: 100%; padding: 12px 16px; border: 2px solid #E3DFD9; border-radius: 8px; font-family: 'Inter', sans-serif; font-size: 0.95rem; color: #3B2F2F; background-color: #FAF8F5; box-sizing: border-box; outline: none; transition: border-color 0.3s;"
              onfocus="this.style.borderColor='#3B2F2F';" onblur="this.style.borderColor='#E3DFD9';">
          </div>
          <div class="form-group" style="margin-bottom: 30px;">
            <label for="user-branch"
              style="display: block; font-family: 'Montserrat', sans-serif; font-size: 0.85rem; font-weight: 600; color: #3B2F2F; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em;">Franquicia
              / Sucursal</label>
            <input type="text" id="user-branch" required placeholder="Ej. Sucursal Centro"
              style="width: 100%; padding: 12px 16px; border: 2px solid #E3DFD9; border-radius: 8px; font-family: 'Inter', sans-serif; font-size: 0.95rem; color: #3B2F2F; background-color: #FAF8F5; box-sizing: border-box; outline: none; transition: border-color 0.3s;"
              onfocus="this.style.borderColor='#3B2F2F';" onblur="this.style.borderColor='#E3DFD9';">
          </div>
          <button type="submit" class="cta-button" id="btn-submit-auth"
            style="width: 100%; justify-content: center; background-color: #3B2F2F; color: #FFFFFF; border: none; padding: 14px 20px; font-size: 1rem; font-weight: 600; font-family: 'Montserrat', sans-serif; border-radius: 30px; cursor: pointer; transition: 0.3s; border: 2px solid #3B2F2F; box-shadow: 0 8px 24px rgba(43, 27, 23, 0.08);">
            Comenzar Evaluación &rarr;
          </button>
        </form>
      </div>
    </section>

    <!-- 3. Vista B: SaaS Widget Cuestionario -->
    <section class="widget-wrapper" id="widget-wrapper"
      style="display: none; width: 100%; flex-direction: column; align-items: center; justify-content: center; text-align: center; box-sizing: border-box; padding: 20px;">
      <div class="widget-card">

        <!-- Header del Widget (Progreso & Métricas) -->
        <header class="widget-header">
          <div class="progress-container" style="max-width: 100%;">
            <div class="progress-label">
              <span id="question-num">Pregunta 1 de 20</span>
              <span id="current-progress-text">0%</span>
            </div>
            <div class="progress-track">
              <div class="progress-fill" id="progress-fill"></div>
            </div>
          </div>
        </header>

        <!-- Cuerpo de Pregunta y Respuestas -->
        <div class="widget-body">
          <div class="question-meta">Estándar de Preparación</div>
          <h2 class="question-text" id="question-text">
            Cargando pregunta...
          </h2>

          <!-- Opciones Grid -->
          <div class="options-grid" id="options-grid" role="group" aria-label="Opciones de respuesta">
            <!-- Cargadas dinámicamente desde app.js -->
          </div>

          <!-- Panel de Retroalimentación de Reglas del Manual -->
          <div class="feedback-panel" id="feedback-panel" role="alert">
            <div class="feedback-header" id="feedback-header">
              <!-- Cargado dinámicamente -->
            </div>
            <div class="feedback-text" id="feedback-text">
              <!-- Cargado dinámicamente -->
            </div>
          </div>
        </div>

        <!-- Footer del Widget (Acción) -->
        <footer class="widget-footer">
          <button class="btn-next" id="btn-next" disabled>
            Siguiente Pregunta
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </footer>

      </div>
    </section>

    <!-- 4. Vista C: Dashboard de Resultados -->
    <section class="results-dashboard" id="results-dashboard"
      style="display: none; width: 100%; flex-direction: column; align-items: center; justify-content: center; text-align: center; box-sizing: border-box; padding: 20px;">
      <div class="widget-card" style="padding: 60px 40px; margin: 0;">
        <div class="results-badge" id="results-badge">📋</div>
        <h2 class="results-title" id="results-title">Evaluación Completada</h2>
        <div class="results-score" id="results-score">20 / 20 Aciertos</div>
        <div class="results-percentage" id="results-percentage">100% de Eficiencia</div>
        <div class="results-actions">
          <button class="cta-button" id="btn-restart" style="padding: 12px 28px; font-size: 0.95rem;">
            Volver a Intentar
          </button>
          <button class="cta-button" id="btn-download-pdf"
            style="padding: 12px 28px; font-size: 0.95rem; background-color: transparent; color: #3B2F2F; border: 2px solid #3B2F2F; box-shadow: none;">
            Descargar PDF
          </button>
        </div>
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>

</html>
